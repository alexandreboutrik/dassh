name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System and C/eBPF Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            make \
            clang \
            llvm \
            linux-libc-dev \
            linux-tools-common \
            linux-tools-generic \
            linux-tools-azure \
            linux-cloud-tools-azure \
            linux-tools-$(uname -r) \
            linux-cloud-tools-$(uname -r) \
            linux-headers-$(uname -r) \
            pkg-config \
            libbpf-dev \
            libelf-dev \
            zlib1g-dev \
            gcc-multilib \
            clang-format \
            shfmt

      - name: Build and install bpftool from source (libbpf/bpftool)
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/libbpf/bpftool.git /tmp/bpftool
          cd /tmp/bpftool/src
          make -j$(nproc)
          sudo make install
          sudo ldconfig
          bpftool version

      - name: Setup Haskell Toolchain
        uses: haskell-actions/setup@v2
        with:
          ghc-version: 'latest'
          cabal-version: 'latest'

      - name: Install Haskell Linters & Formatters
        run: |
          mkdir -p $HOME/.local/bin
          
          # 1. Download pre-compiled HLint v3.10
          echo "Downloading HLint..."
          curl -f -sSL https://github.com/ndmitchell/hlint/releases/download/v3.10/hlint-3.10-x86_64-linux.tar.gz | tar -xz -C /tmp
          mv /tmp/hlint-3.10/hlint $HOME/.local/bin/
          
          # 2. Download pre-compiled Fourmolu v0.20.0.0
          echo "Downloading Fourmolu..."
          curl -f -sSL -o /tmp/fourmolu.zip https://github.com/fourmolu/fourmolu/releases/download/v0.20.0.0/fourmolu-0.20.0.0-linux-x86_64.zip
          unzip -q /tmp/fourmolu.zip -d /tmp/fourmolu
          mv /tmp/fourmolu/fourmolu-0.20.0.0-linux-x86_64/fourmolu $HOME/.local/bin/
          chmod +x $HOME/.local/bin/fourmolu
          
          # Expose the binaries to GitHub Actions
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Check Formatting & Linting
        run: |
          chmod +x ./scripts/format.sh
          ./scripts/format.sh check -lint

      - name: Verify Compilation
        run: |
          make clean
          make all
